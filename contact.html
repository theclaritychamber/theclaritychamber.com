<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | THE CLARITY CHAMBER</title>
    <style>
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .full-width {
            grid-column: 1 / -1;
            text-align: center;
        }
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>THE CLARITY CHAMBER</h1>
        <p>Find clarity. Move forward.</p>
        <p>Tarot readings for clarity, perspective & honest guidance.</p>
        <nav>
            <a href="index.html">Home</a> | 
            <a href="about.html">About Us</a> | 
            <a href="readings.html">Readings</a> | 
            <a href="how-it-works.html">How It Works</a> | 
            <a href="contact.html">Book a Reading</a>
        </nav>
    </header>

    <hr>

    <main>
        <section>
            <h2>Choose Your Reading</h2>
            <form action="#" method="post">
                <div class="form-grid">
                    <div class="column">
                        <p>
                            <label for="reading-type">Choose Your Reading</label><br>
                            <select id="reading-type" name="reading-type" required onchange="updateOptions()">
                                <option value="" disabled selected>Select</option>
                                <option value="live">Live Video Reading</option>
                                <option value="recorded">Recorded Video Reading</option>
                            </select>
                        </p>
                        <p>
                            <label for="reading-option">Readings</label><br>
                            <select id="reading-option" name="reading-option" required onchange="handlePackageSelection()">
                                <option value="" disabled selected>Select</option>
                            </select>
                        </p>
                        <div id="live-datetime-container" style="display: none;">
                            <p>
                                <label for="platform">Zoom/Google Meet?</label><br>
                                <select id="platform" name="platform">
                                    <option value="" disabled selected>Select</option>
                                    <option value="zoom">Zoom</option>
                                    <option value="google-meet">Google Meet</option>
                                </select>
                            </p>
                            <p>
                                <label for="booking-date">Preferred Date</label><br>
                                <input type="date" id="booking-date" name="booking-date">
                            </p>
                            <p>
                                <label for="booking-time">Preferred Time</label><br>
                                <input type="time" id="booking-time" name="booking-time">
                            </p>
                        </div>
                        <div id="recorded-questions-container" style="display: none;"></div>
                    </div>

                    <div class="column">
                        <p>
                            <label for="first-name">First Name</label><br>
                            <input type="text" id="first-name" name="first-name" required>
                        </p>
                        <p>
                            <label for="last-name">Last Name</label><br>
                            <input type="text" id="last-name" name="last-name" required>
                        </p>
                        <p>
                            <label for="email">Email</label><br>
                            <input type="email" id="email" name="email" required>
                        </p>
                        <p>
                            <label for="phone">Phone</label><br>
                            <input type="tel" id="phone" name="phone" required>
                        </p>
                        <p>
                            <label for="remarks">Remarks (if any)</label><br>
                            <textarea id="remarks" name="remarks" rows="5"></textarea>
                        </p>
                    </div>

                    <div class="full-width">
                        <p>
                            <button type="submit">Submit</button>
                        </p>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <script>
        function updateOptions() {
            const readingType = document.getElementById('reading-type').value;
            const optionSelect = document.getElementById('reading-option');

            optionSelect.innerHTML = '<option value="" disabled selected>Select</option>';
            resetDynamicContainers();

            if (readingType === 'live') {
                optionSelect.innerHTML += `
                    <option value="live-30">30 Minutes - $60</option>
                    <option value="live-60">60 Minutes - $80</option>
                    <option value="live-90">90 Minutes - $100</option>
                `;
            } else if (readingType === 'recorded') {
                optionSelect.innerHTML += `
                    <option value="rec-5">5 Questions - $60</option>
                    <option value="rec-7">7 Questions - $80</option>
                    <option value="rec-11">11 Questions - $100</option>
                `;
            }
        }

        function handlePackageSelection() {
            const readingType = document.getElementById('reading-type').value;
            const selectedOption = document.getElementById('reading-option').value;
            const datetimeContainer = document.getElementById('live-datetime-container');
            const questionsContainer = document.getElementById('recorded-questions-container');
            const platform = document.getElementById('platform');
            const bookingDate = document.getElementById('booking-date');
            const bookingTime = document.getElementById('booking-time');

            resetDynamicContainers();

            if (readingType === 'live' && selectedOption) {
                datetimeContainer.style.display = 'block';
                platform.required = true;
                bookingDate.required = true;
                bookingTime.required = true;
            } else if (readingType === 'recorded' && selectedOption) {
                let count = 0;
                if (selectedOption === 'rec-5') count = 5;
                else if (selectedOption === 'rec-7') count = 7;
                else if (selectedOption === 'rec-11') count = 11;

                if (count > 0) {
                    questionsContainer.style.display = 'block';
                    
                    const note = document.createElement('p');
                    note.innerHTML = '<em>Readings will be delivered within 3 business days after your questions are received.</em>';
                    questionsContainer.appendChild(note);

                    for (let i = 1; i <= count; i++) {
                        const p = document.createElement('p');
                        p.innerHTML = `
                            <label for="question-${i}">Question ${i}</label><br>
                            <input type="text" id="question-${i}" name="question-${i}" required>
                        `;
                        questionsContainer.appendChild(p);
                    }
                }
            }
        }

        function resetDynamicContainers() {
            const datetimeContainer = document.getElementById('live-datetime-container');
            const questionsContainer = document.getElementById('recorded-questions-container');
            const platform = document.getElementById('platform');
            const bookingDate = document.getElementById('booking-date');
            const bookingTime = document.getElementById('booking-time');

            datetimeContainer.style.display = 'none';
            platform.required = false;
            bookingDate.required = false;
            bookingTime.required = false;

            questionsContainer.style.display = 'none';
            questionsContainer.innerHTML = '';
        }
    </script>

    <hr>

    <footer>
        <p>
            <a href="index.html">Home</a> | 
            <a href="faq.html">FAQ</a> | 
            <a href="contact.html">Book a Reading</a> | 
            <a href="contact.html">Contact</a> | 
            <a href="legal.html">Legal</a>
        </p>
        <p>&copy; The Clarity Chamber. All rights reserved.</p>
    </footer>
</body>
</html>
