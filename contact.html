<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact & Booking | The Clarity Chamber</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <header class="site-header">
    <div class="logo">The Clarity Chamber</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html" class="active">Contact & Booking</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-container container">
    <section class="hero">
      <h1 class="hero-title">READY FOR <span class="highlight">CLARITY?</span></h1>
      <p class="hero-description">Let's uncover the answers you're seeking. I'm here to guide you.</p>
    </section>

    <section class="form-container">
      <form class="contact-form" action="#" method="POST">
        <div class="form-group">
          <label for="name">FULL NAME</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">EMAIL ADDRESS</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="service">INTERESTED READING</label>
          <select id="service" name="service">
            <option value="virtual">Live / Virtual Reading</option>
            <option value="recorded">Recorded Video Reading</option>
            <option value="in-person">In-Person Reading</option>
            <option value="other">General Inquiry</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">YOUR MESSAGE</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">BOOK YOUR SESSION &rsaquo;</button>
      </form>
    </section>
  </main>

  <footer class="footer-contact container">
    <div class="contact-item">
      <div class="contact-icon">✉</div>
      <p>theclaritychamber@gmail.com</p>
    </div>
    <p>&copy; The Clarity Chamber. All rights reserved.</p>
  </footer>

</body>
</html>
